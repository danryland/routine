name: Native apps

on:
  push:
    paths: ["ios/**", "android/**", "fixtures/**", ".github/workflows/native-apps.yml"]
  pull_request:
    paths: ["ios/**", "android/**", "fixtures/**", ".github/workflows/native-apps.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        working-directory: ios
        run: swift test
      - name: Build app and widget
        run: |
          xcodebuild build \
            -project ios/Routine.xcodeproj \
            -scheme Routine \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: UI tests in the simulator
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          names = [d["name"] for d in devices]
          print(next((n for n in ["iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro"] if n in names), next(n for n in names if n.startswith("iPhone"))))
          ')
          echo "Testing on $DEVICE"
          TEST_RUNNER_SCREENSHOT_DIR="$RUNNER_TEMP/screenshots" xcodebuild test \
            -project ios/Routine.xcodeproj \
            -scheme Routine \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 180 \
            CODE_SIGNING_ALLOWED=NO
      - name: Print screenshots
        if: always()
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 .github/scripts/print-screenshots.py "$RUNNER_TEMP/screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ${{ runner.temp }}/screenshots

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests, build and lint
        working-directory: android
        run: ./gradlew :core:test :app:assembleDebug :app:lintDebug

  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and test APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: ./android/scripts/emulator-ui-tests.sh
      - name: Print screenshots
        if: always()
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 .github/scripts/print-screenshots.py android/build/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: android/build/screenshots
